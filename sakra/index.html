<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Boato x Taberna Sakra — Reservations</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:var(--red);}
  a:hover{color:var(--red-deep);}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:min(380px,100%);background:var(--mist);border:1px solid var(--line);padding:40px 34px;text-align:center;}
  .login-card .mark{font-family:var(--font-display);font-size:2.2rem;color:var(--ink);margin:0 0 4px;}
  .login-card .mark span{color:var(--red);}
  .login-card .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 28px;}
  .login-card input{width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line-strong);border-radius:2px;padding:13px 14px;outline:none;margin-bottom:14px;transition:border-color .16s;}
  .login-card input:focus{border-color:var(--olive);}
  .login-card button{width:100%;font-family:var(--font-body);font-size:14px;font-weight:700;letter-spacing:.01em;
    padding:14px 28px;border:0;border-radius:2px;cursor:pointer;background:var(--ink);color:var(--paper);transition:background .16s;}
  .login-card button:hover{background:#000;}
  .login-card .err{font-family:var(--font-mono);font-size:11.5px;color:var(--red);margin:12px 0 0;min-height:14px;}

  /* ---------- Dashboard shell ---------- */
  .dash{display:none;}
  .dash.on{display:block;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:18px var(--gutter);
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--font-display);font-weight:400;font-size:1.6rem;margin:0;white-space:nowrap;}
  .topbar h1 span{color:var(--red);}
  .searchbox{flex:1 1 240px;max-width:360px;}
  .searchbox input{width:100%;font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--mist);
    border:1px solid var(--line-strong);border-radius:2px;padding:10px 14px;outline:none;transition:border-color .16s;}
  .searchbox input:focus{border-color:var(--olive);}
  .topbar-actions{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .pill-count{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap;}
  .btn-mini{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    background:none;border:1px solid var(--line-strong);color:var(--ink);border-radius:2px;padding:8px 14px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .btn-mini:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .content{max-width:var(--maxw);margin:0 auto;padding:36px var(--gutter) 100px;}
  .slots-wrap{display:flex;flex-direction:column;gap:40px;}
  .time-slot{padding:0;}
  .slot-title{font-family:var(--font-display);font-weight:400;font-size:1.8rem;color:var(--ink);margin:0 0 20px;text-align:center;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .card{background:var(--mist);border:1px solid var(--line);padding:18px 20px;position:relative;}
  .card.arrived{border-left:3px solid var(--olive);}
  .card__top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .card__name{font-family:var(--font-display);font-size:1.2rem;line-height:1.15;}
  .card__badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);display:block;margin-top:2px;}
  .card__ts{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-4);white-space:nowrap;margin-top:3px;}
  .card__rows{display:flex;flex-direction:column;gap:5px;}
  .card__row{font-size:13.5px;line-height:1.4;color:var(--ink-2);display:flex;gap:6px;align-items:center;}
  .card__row b{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;flex-shrink:0;min-width:56px;padding-top:2px;}
  .card__row span{word-break:break-word;}
  .card__row .time-edit{display:flex;gap:6px;flex:1;}
  .card__row .time-edit input{flex:1;min-width:0;font-family:var(--font-body);font-size:13px;color:var(--ink);
    background:var(--paper);border:1px solid var(--olive);border-radius:2px;padding:5px 8px;outline:none;}
  .card__row .time-edit button{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    border:0;background:none;cursor:pointer;padding:0 4px;}
  .card__row .time-edit .save{color:var(--olive);font-weight:700;}
  .card__row .time-edit .cancel{color:var(--ink-3);}

  .card__actions{display:flex;gap:12px;flex-wrap:wrap;padding-top:12px;margin-top:12px;border-top:1px solid var(--line);}
  .card__actions button{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0;transition:color .16s;font-weight:600;}
  .card__actions button:hover{color:var(--red);}
  .card__actions button.is-active{color:var(--olive);}
  .card__actions button.is-active:hover{color:var(--olive-deep);}
  .card__actions button.danger:hover{color:var(--red);}

  .empty{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-4);padding:20px 0;}

  /* ---------- Add-reservation modal ---------- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(12,11,10,.5);z-index:100;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.on{display:flex;}
  .modal{width:min(440px,100%);max-height:90vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line-strong);padding:32px 30px;}
  .modal h3{font-family:var(--font-display);font-weight:400;font-size:1.4rem;margin:0 0 20px;}
  .modal label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;}
  .modal .field{margin-bottom:14px;}
  .modal input,.modal textarea{width:100%;font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--mist);
    border:1px solid var(--line-strong);border-radius:2px;padding:10px 12px;outline:none;transition:border-color .16s;}
  .modal input:focus,.modal textarea:focus{border-color:var(--olive);}
  .modal__actions{display:flex;gap:12px;margin-top:22px;}
  .modal__actions button{flex:1;font-family:var(--font-body);font-size:14px;font-weight:700;padding:13px;border:0;border-radius:2px;cursor:pointer;transition:background .16s;}
  .modal__actions .save{background:var(--ink);color:var(--paper);}
  .modal__actions .save:hover{background:#000;}
  .modal__actions .cancel{background:none;border:1px solid var(--line-strong);color:var(--ink);}
  .modal__actions .cancel:hover{background:var(--mist);}

  @media(max-width:640px){
    .login-card{padding:32px 24px;}
    .topbar{padding:14px 16px;gap:12px;}
    .topbar h1{font-size:1.3rem;}
    .searchbox{flex:1 1 100%;max-width:none;order:3;}
    .topbar-actions{width:100%;justify-content:space-between;order:4;margin-left:0;flex-wrap:wrap;gap:10px;}
    .content{padding:20px 16px 70px;}
    .slots-wrap{gap:30px;}
    .slot-title{font-size:1.4rem;margin-bottom:16px;}
    .cards{grid-template-columns:1fr;gap:12px;}
    .card{padding:16px;}
    .card__top{flex-direction:column;gap:4px;}
    .card__row b{min-width:52px;}
    .card__actions{gap:8px 14px;}
    .login-card input,.searchbox input{font-size:16px;}
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <p class="mark">boato<span>.</span></p>
    <p class="sub">Taberna Sakra</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" />
    <button id="pwSubmit">Enter</button>
    <p class="err" id="pwErr"></p>
  </div>
</div>

<div class="dash" id="dash">
  <div class="topbar">
    <h1>boato<span>.</span> x sakra</h1>
    <div class="searchbox"><input type="text" id="search" placeholder="Search name or email…"></div>
    <div class="topbar-actions">
      <span class="pill-count" id="totalCount"></span>
      <button class="btn-mini" id="addBtn">+ Add reservation</button>
      <button class="btn-mini" id="exportBtn">Export CSV</button>
      <button class="btn-mini" id="logoutBtn">Log out</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <h3>Add reservation manually</h3>
    <div class="field"><label>Name</label><input id="addName" type="text" placeholder="Guest name"></div>
    <div class="field"><label>Email</label><input id="addEmail" type="email" placeholder="guest@email.com"></div>
    <div class="field"><label>Phone</label><input id="addPhone" type="text" placeholder="+351…"></div>
    <div class="field"><label>Seats</label><input id="addSeats" type="text" placeholder="e.g. 2"></div>
    <div class="field"><label>Time</label><input id="addTime" type="text" placeholder="e.g. 21:00"></div>
    <div class="field"><label>Note</label><textarea id="addNote" rows="2" placeholder="Allergies, occasion, etc."></textarea></div>
    <div class="modal__actions">
      <button class="cancel" id="addCancel">Cancel</button>
      <button class="save" id="addSave">Add reservation</button>
    </div>
  </div>
</div>

<script src="../js/submissions-store.js"></script>
<script>
/* ============================================================
   Shared-password gate, view scoped to a single dinner.
   Client-side only — fine for sharing a guest list with a venue
   partner, not a substitute for real auth. Change the password by
   editing SAKRA_PASSWORD below.
   ============================================================ */
const SAKRA_PASSWORD = "sakra";
const SESSION_KEY = "boato_sakra_session";
const DINNER_NAME = "Boato x Taberna Sakra";

function fmtTs(iso){
  try{
    const d = new Date(iso);
    return new Intl.DateTimeFormat("en-GB",{ day:"2-digit", month:"short", year:"numeric" }).format(d) + " · " +
      new Intl.DateTimeFormat("en-GB",{ hour:"2-digit", minute:"2-digit" }).format(d);
  }catch(e){ return iso || ""; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

let ALL = [];
let editingTimeId = null;

function matchesSearch(row, q){
  if (!q) return true;
  const hay = ((row.data.Name || "") + " " + (row.data.Email || "")).toLowerCase();
  return hay.includes(q);
}

function groupByTimeSlot(rows){
  const slot1900 = [];
  const slot1930 = [];
  const slot2100 = [];
  const slot2130 = [];
  rows.forEach((r) => {
    const time = (r.data && r.data.Time || "").toLowerCase();
    if (time.includes("19:30")) slot1930.push(r);
    else if (time.includes("19")) slot1900.push(r);
    else if (time.includes("21:30")) slot2130.push(r);
    else if (time.includes("21")) slot2100.push(r);
    else slot1900.push(r); // default to 19:00 if no time
  });
  return { slot1900, slot1930, slot2100, slot2130 };
}

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const content = document.getElementById("content");
  const rows = ALL.filter((r) => matchesSearch(r, q));

  document.getElementById("totalCount").textContent = rows.length + " reservation" + (rows.length === 1 ? "" : "s");

  content.innerHTML = "";
  if (!rows.length){
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = q ? "No matches." : "No reservations yet.";
    content.appendChild(empty);
    return;
  }

  const { slot1900, slot1930, slot2100, slot2130 } = groupByTimeSlot(rows);

  const wrap = document.createElement("div");
  wrap.className = "slots-wrap";

  const slots = [
    { time: "19:00", data: slot1900 },
    { time: "19:30", data: slot1930 },
    { time: "21:00", data: slot2100 },
    { time: "21:30", data: slot2130 }
  ];

  slots.forEach(({ time, data }) => {
    if (data.length > 0){
      const slot = document.createElement("div");
      slot.className = "time-slot";
      slot.innerHTML = `<h3 class="slot-title">${time}</h3>`;
      const cards = document.createElement("div");
      cards.className = "cards";
      data.forEach((r) => cards.appendChild(buildCard(r)));
      slot.appendChild(cards);
      wrap.appendChild(slot);
    }
  });

  content.appendChild(wrap);
}

function timeRowHTML(r){
  const d = r.data || {};
  if (editingTimeId === r.id){
    return `<div class="card__row"><b>Time</b>
      <span class="time-edit">
        <input type="text" id="timeInput-${r.id}" value="${escapeHtml(d.Time || "")}" placeholder="e.g. 21:00">
        <button type="button" class="save" data-save-time="${r.id}">Save</button>
        <button type="button" class="cancel" data-cancel-time="${r.id}">Cancel</button>
      </span>
    </div>`;
  }
  return `<div class="card__row"><b>Time</b><span>${escapeHtml(d.Time || "—")}</span></div>`;
}

function buildCard(r){
  const d = r.data || {};
  const arrived = !!d.Arrived;
  const fields = [
    ["Email", d.Email], ["Phone", d.Phone], ["Seats", d.Seats]
  ].filter(([, v]) => v);
  const noteField = d.Note ? [["Note", d.Note]] : [];

  const card = document.createElement("div");
  card.className = "card" + (arrived ? " arrived" : "");
  card.innerHTML = `
    <div class="card__top">
      <div>
        <div class="card__name">${escapeHtml(d.Name || d.Email || "—")}</div>
        ${arrived ? `<span class="card__badge">✓ Arrived</span>` : ""}
      </div>
      <div class="card__ts">${escapeHtml(fmtTs(r.ts))}</div>
    </div>
    <div class="card__rows">
      ${fields.map(([k, v]) => `<div class="card__row"><b>${k}</b><span>${escapeHtml(v)}</span></div>`).join("")}
      ${timeRowHTML(r)}
      ${noteField.map(([k, v]) => `<div class="card__row"><b>${k}</b><span>${escapeHtml(v)}</span></div>`).join("")}
    </div>
    <div class="card__actions">
      <button type="button" class="${arrived ? "is-active" : ""}" data-act="arrive">${arrived ? "Unmark arrival" : "Confirm arrival"}</button>
      <button type="button" data-act="edit-time">Change time</button>
      <button type="button" class="danger" data-act="delete">Delete</button>
    </div>
  `;

  card.querySelector('[data-act="arrive"]').addEventListener("click", async () => {
    const newData = { ...d, Arrived: !arrived };
    await window.BoatoSubmissions.setData(r.id, newData);
    r.data = newData;
    render();
  });
  card.querySelector('[data-act="edit-time"]').addEventListener("click", () => {
    editingTimeId = r.id;
    render();
    const input = document.getElementById("timeInput-" + r.id);
    if (input) { input.focus(); input.select(); }
  });
  card.querySelector('[data-act="delete"]').addEventListener("click", async () => {
    if (!confirm("Delete this reservation?")) return;
    await window.BoatoSubmissions.remove(r.id);
    ALL = ALL.filter((x) => x.id !== r.id);
    render();
  });

  // Attach time editor listeners (only when edit mode is active)
  setTimeout(() => {
    const timeEditSpan = card.querySelector(".time-edit");
    if (!timeEditSpan) return;

    const input = timeEditSpan.querySelector("input");
    const saveBtns = timeEditSpan.querySelectorAll("button.save");
    const cancelBtns = timeEditSpan.querySelectorAll("button.cancel");

    if (!input) return;

    const commit = async () => {
      const newTime = input.value.trim();
      const newData = { ...d, Time: newTime };
      await window.BoatoSubmissions.setData(r.id, newData);
      r.data = newData;
      editingTimeId = null;
      render();
    };

    saveBtns.forEach(btn => btn.addEventListener("click", commit));
    cancelBtns.forEach(btn => btn.addEventListener("click", () => { editingTimeId = null; render(); }));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); });
    input.focus();
  }, 0);

  return card;
}

function exportCsv(){
  if (!ALL.length) return;
  const keys = Array.from(ALL.reduce((set, r) => { Object.keys(r.data).forEach((k) => set.add(k)); return set; }, new Set()));
  const header = ["Submitted", ...keys];
  const lines = [header.join(",")];
  ALL.forEach((r) => {
    const line = [fmtTs(r.ts), ...keys.map((k) => `"${String(r.data[k] || "").replace(/"/g, '""')}"`)];
    lines.push(line.join(","));
  });
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "boato-x-sakra-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
}

async function loadAndRender(){
  const rows = await window.BoatoSubmissions.fetchAll();
  ALL = rows.filter((r) => r.type === "popup" && (r.data && r.data.Dinner) === DINNER_NAME);
  render();
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("exportBtn").addEventListener("click", exportCsv);

/* ---------- Add reservation manually ---------- */
function openAddModal(){
  ["addName","addEmail","addPhone","addSeats","addTime","addNote"].forEach((id) => document.getElementById(id).value = "");
  document.getElementById("addOverlay").classList.add("on");
}
function closeAddModal(){
  document.getElementById("addOverlay").classList.remove("on");
}
document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("addCancel").addEventListener("click", closeAddModal);
document.getElementById("addOverlay").addEventListener("click", (e) => { if (e.target.id === "addOverlay") closeAddModal(); });

document.getElementById("addSave").addEventListener("click", async () => {
  const data = {
    Name: document.getElementById("addName").value.trim(),
    Email: document.getElementById("addEmail").value.trim(),
    Phone: document.getElementById("addPhone").value.trim(),
    Seats: document.getElementById("addSeats").value.trim(),
    Time: document.getElementById("addTime").value.trim(),
    Note: document.getElementById("addNote").value.trim(),
    Dinner: DINNER_NAME
  };
  Object.keys(data).forEach((k) => { if (!data[k] && k !== "Dinner") delete data[k]; });
  if (!data.Name && !data.Email){
    alert("Add at least a name or email.");
    return;
  }
  await window.BoatoSubmissions.save("popup", data);
  closeAddModal();
  await loadAndRender();
});

/* ---------- Auth ---------- */
function showDash(){
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("dash").classList.add("on");
  loadAndRender();
}
function tryLogin(){
  const val = document.getElementById("pw").value;
  if (val === SAKRA_PASSWORD){
    sessionStorage.setItem(SESSION_KEY, "1");
    showDash();
  } else {
    document.getElementById("pwErr").textContent = "Incorrect password.";
  }
}
document.getElementById("pwSubmit").addEventListener("click", tryLogin);
document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById("dash").classList.remove("on");
  document.getElementById("loginWrap").style.display = "flex";
  document.getElementById("pw").value = "";
});

if (sessionStorage.getItem(SESSION_KEY) === "1") showDash();
</script>
</body>
</html>
