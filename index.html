    <h1>Boato Supper Club — Private Dining in Lisbon</h1>
    <p><strong>Follow the rumor.</strong> Boato is a private supper club created by Chef Miguel Ângelo in Lisbon. Twelve seats, one long table, and a secret location we whisper to you 24 hours before.</p>
    <h2>The concept</h2>
    <p>Boato is not a restaurant — it's a rumor you're now part of. A shared seasonal tasting menu, somewhere in Lisbon you wouldn't expect. Seasonal, local, and slightly improvised, the way the best dinners are.</p>
    <h2>The dinners</h2>
    <p>Past tables, and the next one. Secret-location supper clubs, surprise pop-ups, corporate dinners and fully private events. Seats are limited; addresses are shared 24 hours before each dinner.</p>
    <h2>Private &amp; corporate</h2>
    <p>Host your own rumor: take over a full Boato table, or commission a dinner for your team or clients. Bespoke menus, full production, wine and cocktail pairings, hosted in Portuguese, English, Spanish and Italian.</p>
    <h2>The chef</h2>
    <p>Miguel Ângelo — Lisbon-born and restaurant-trained — shops the market the morning of each dinner and lets it decide the menu: Portuguese ingredients, contemporary technique, a story behind every plate.</p>
