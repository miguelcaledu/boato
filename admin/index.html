<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Boato Supper Club</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:var(--red);}
  a:hover{color:var(--red-deep);}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:min(380px,100%);background:var(--mist);border:1px solid var(--line);padding:40px 34px;text-align:center;}
  .login-card .mark{font-family:var(--font-display);font-size:2.2rem;color:var(--ink);margin:0 0 4px;}
  .login-card .mark span{color:var(--red);}
  .login-card .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 28px;}
  .login-card input{width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line-strong);border-radius:2px;padding:13px 14px;outline:none;margin-bottom:14px;transition:border-color .16s;}
  .login-card input:focus{border-color:var(--olive);}
  .login-card button{width:100%;font-family:var(--font-body);font-size:14px;font-weight:700;letter-spacing:.01em;
    padding:14px 28px;border:0;border-radius:2px;cursor:pointer;background:var(--ink);color:var(--paper);transition:background .16s;}
  .login-card button:hover{background:#000;}
  .login-card .err{font-family:var(--font-mono);font-size:11.5px;color:var(--red);margin:12px 0 0;min-height:14px;}

  /* ---------- Dashboard shell ---------- */
  .dash{display:none;}
  .dash.on{display:block;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:18px var(--gutter);
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--font-display);font-weight:400;font-size:1.6rem;margin:0;white-space:nowrap;}
  .topbar h1 span{color:var(--red);}
  .searchbox{flex:1 1 240px;max-width:360px;}
  .searchbox input{width:100%;font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--mist);
    border:1px solid var(--line-strong);border-radius:2px;padding:10px 14px;outline:none;transition:border-color .16s;}
  .searchbox input:focus{border-color:var(--olive);}
  .topbar-actions{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .pill-count{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap;}
  .btn-mini{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    background:none;border:1px solid var(--line-strong);color:var(--ink);border-radius:2px;padding:8px 14px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .btn-mini:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .content{max-width:var(--maxw);margin:0 auto;padding:36px var(--gutter) 100px;}
  section.group{margin-bottom:48px;}
  .group__head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap;}
  .group__head h2{font-family:var(--font-display);font-weight:400;font-size:1.5rem;margin:0;}
  .group__count{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);}
  .group__count .unread{color:var(--red);font-weight:600;}
  .group__head .btn-mini{margin-left:auto;}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .card{background:var(--mist);border:1px solid var(--line);padding:18px 20px;position:relative;}
  .card.unread{border-left:3px solid var(--red);}
  .card.paid{border-left:3px solid var(--olive);}
  .card__top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .card__name{font-family:var(--font-display);font-size:1.2rem;line-height:1.15;}
  .card__ts{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-4);white-space:nowrap;margin-top:3px;}
  .card__rows{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .card__row{font-size:13.5px;line-height:1.4;color:var(--ink-2);display:flex;gap:6px;}
  .card__row b{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;flex-shrink:0;min-width:64px;padding-top:2px;}
  .card__row span{word-break:break-word;}
  .card__actions{display:flex;gap:10px;padding-top:10px;border-top:1px solid var(--line);}
  .card__actions button{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0;transition:color .16s;}
  .card__actions button:hover{color:var(--red);}

  .empty{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-4);padding:20px 0;}

  /* ---------- Add-submission modal ---------- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(12,11,10,.5);z-index:100;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.on{display:flex;}
  .modal{width:min(480px,100%);max-height:90vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line-strong);padding:32px 30px;}
  .modal h3{font-family:var(--font-display);font-weight:400;font-size:1.4rem;margin:0 0 20px;}
  .modal label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;}
  .modal .field{margin-bottom:14px;}
  .modal select,.modal input,.modal textarea{width:100%;font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--mist);
    border:1px solid var(--line-strong);border-radius:2px;padding:10px 12px;outline:none;transition:border-color .16s;}
  .modal select:focus,.modal input:focus,.modal textarea:focus{border-color:var(--olive);}
  .modal__actions{display:flex;gap:12px;margin-top:22px;}
  .modal__actions button{flex:1;font-family:var(--font-body);font-size:14px;font-weight:700;padding:13px;border:0;border-radius:2px;cursor:pointer;transition:background .16s;}
  .modal__actions .save{background:var(--ink);color:var(--paper);}
  .modal__actions .save:hover{background:#000;}
  .modal__actions .cancel{background:none;border:1px solid var(--line-strong);color:var(--ink);}
  .modal__actions .cancel:hover{background:var(--mist);}

  @media(max-width:640px){
    .login-card{padding:32px 24px;}
    .topbar{padding:14px 16px;gap:12px;}
    .topbar h1{font-size:1.3rem;}
    .searchbox{flex:1 1 100%;max-width:none;order:3;}
    .topbar-actions{width:100%;justify-content:space-between;order:4;margin-left:0;}
    .content{padding:20px 16px 70px;}
    .group{margin-bottom:36px;}
    .group__head{gap:8px;}
    .group__head h2{font-size:1.25rem;}
    .group__head .btn-mini{margin-left:0;}
    .cards{grid-template-columns:1fr;gap:12px;}
    .card{padding:16px;}
    .card__top{flex-direction:column;gap:4px;}
    .card__row b{min-width:56px;}
    .card__actions{flex-wrap:wrap;gap:8px 14px;}
    .login-card input,.searchbox input{font-size:16px;}
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <p class="mark">boato<span>.</span></p>
    <p class="sub">Admin</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" />
    <button id="pwSubmit">Enter</button>
    <p class="err" id="pwErr"></p>
  </div>
</div>

<div class="dash" id="dash">
  <div class="topbar">
    <h1>boato<span>.</span> admin</h1>
    <div class="searchbox"><input type="text" id="search" placeholder="Search name or email…"></div>
    <div class="topbar-actions">
      <span class="pill-count" id="totalCount"></span>
      <button class="btn-mini" id="addBtn">+ Add submission</button>
      <button class="btn-mini" id="logoutBtn">Log out</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <h3>Add submission manually</h3>
    <div class="field">
      <label>Section</label>
      <select id="addType">
        <option value="supper">Supper club reservation</option>
        <option value="popup">Pop-up reservation</option>
        <option value="private">Private / corporate inquiry</option>
        <option value="waitlist">Waitlist signup</option>
        <option value="newsletter">Newsletter signup</option>
      </select>
    </div>
    <div class="field"><label>Name</label><input id="addName" type="text" placeholder="Guest name"></div>
    <div class="field"><label>Email</label><input id="addEmail" type="email" placeholder="guest@email.com"></div>
    <div class="field"><label>Phone</label><input id="addPhone" type="text" placeholder="+351…"></div>
    <div class="field"><label>Seats</label><input id="addSeats" type="text" placeholder="e.g. 2"></div>
    <div class="field"><label>Time (pop-up only)</label><input id="addTime" type="text" placeholder="e.g. 21:00"></div>
    <div class="field"><label>Dinner</label><input id="addDinner" type="text" placeholder="e.g. Boato - Supper Club"></div>
    <div class="field"><label>Date</label><input id="addDate" type="text" placeholder="e.g. Friday, 17 July 2026"></div>
    <div class="field"><label>Note</label><textarea id="addNote" rows="2" placeholder="Dietary notes, occasion, etc."></textarea></div>
    <div class="modal__actions">
      <button class="cancel" id="addCancel">Cancel</button>
      <button class="save" id="addSave">Add submission</button>
    </div>
  </div>
</div>

<script src="../js/submissions-store.js"></script>
<script>
/* ============================================================
   Shared-password gate. The real password is never stored in this
   file — only its SHA-256 hash, so anyone browsing the GitHub repo
   or viewing page source can't read it. The actual password (typed
   at login) is kept in sessionStorage only, cleared when the tab
   closes, and sent to Supabase to satisfy the server-side check in
   supabase-rls-setup.sql (which must be updated together — see the
   "keep in sync" note in that file).

   To change the password: pick a new one, compute its SHA-256 hash
   (e.g. run `echo -n 'yourpassword' | shasum -a 256` in Terminal),
   paste the hash below, AND update the matching Postgres function
   in supabase-rls-setup.sql with the new password.
   ============================================================ */
const ADMIN_PASSWORD_HASH = "956eb928a61dbc2e3468cf3ef3142cbfb0b586615fbf9db1b83a5ef62043a10e";
const SESSION_KEY = "boato_admin_session";

const SECTIONS = [
  { type: "supper",  title: "Supper club reservations" },
  { type: "popup",   title: "Pop-up reservations" },
  { type: "private", title: "Private / corporate inquiries" },
  { type: "waitlist",title: "Waitlist signups" },
  { type: "newsletter", title: "Newsletter signups" }
];

const FIELD_LABELS = { Name:"Name", Email:"Email", Phone:"Phone", Seats:"Seats", Time:"Time", Dinner:"Dinner",
  Date:"Date", "Pop-up":"Pop-up", Note:"Note", Type:"Type", Guests:"Guests", Occasion:"Occasion" };

function fmtTs(iso){
  try{
    const d = new Date(iso);
    return new Intl.DateTimeFormat("en-GB",{ day:"2-digit", month:"short", year:"numeric" }).format(d) + " · " +
      new Intl.DateTimeFormat("en-GB",{ hour:"2-digit", minute:"2-digit" }).format(d);
  }catch(e){ return iso || ""; }
}

function rowFields(type, data){
  let keys;
  if (type === "popup") keys = ["Name","Email","Phone","Seats","Time","Dinner","Date","Note"];
  else if (type === "supper" || type === "private") keys = ["Name","Email","Phone","Seats","Dinner","Date","Note"];
  else keys = ["Email"];
  return keys;
}

function cardTitle(type, data){
  if (data.Name) return data.Name;
  if (data.Email) return data.Email;
  return "—";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

let ALL = [];

function matchesSearch(row, q){
  if (!q) return true;
  const hay = ((row.data.Name || "") + " " + (row.data.Email || "")).toLowerCase();
  return hay.includes(q);
}

async function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const content = document.getElementById("content");
  content.innerHTML = "";
  let total = 0, unreadTotal = 0;

  SECTIONS.forEach((sec) => {
    const rows = ALL.filter((r) => r.type === sec.type && matchesSearch(r, q));
    total += rows.length;
    const unread = rows.filter((r) => !r.read).length;
    unreadTotal += unread;

    const group = document.createElement("section");
    group.className = "group";

    const head = document.createElement("div");
    head.className = "group__head";
    head.innerHTML = `<h2>${sec.title}</h2><span class="group__count">${rows.length} total${unread ? ` · <span class="unread">${unread} new</span>` : ""}</span>` +
      (rows.length ? `<button class="btn-mini" data-export="${sec.type}">Export CSV</button>` : "");
    group.appendChild(head);

    if (!rows.length){
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = q ? "No matches in this section." : "No submissions yet.";
      group.appendChild(empty);
    } else {
      const cardsWrap = document.createElement("div");
      cardsWrap.className = "cards";
      rows.forEach((r) => cardsWrap.appendChild(buildCard(r)));
      group.appendChild(cardsWrap);
    }
    content.appendChild(group);
  });

  document.getElementById("totalCount").textContent =
    total + " submission" + (total === 1 ? "" : "s") + (unreadTotal ? " · " + unreadTotal + " new" : "");

  content.querySelectorAll("[data-export]").forEach((btn) => {
    btn.addEventListener("click", () => exportCsv(btn.getAttribute("data-export")));
  });
}

const PAYABLE_TYPES = ["supper", "popup", "private"];

function buildCard(r){
  const card = document.createElement("div");
  card.className = "card" + (r.read ? "" : " unread") + (r.paid ? " paid" : "");
  const fields = rowFields(r.type, r.data);
  const canPay = PAYABLE_TYPES.includes(r.type);
  card.innerHTML = `
    <div class="card__top">
      <div class="card__name">${escapeHtml(cardTitle(r.type, r.data))}</div>
      <div class="card__ts">${escapeHtml(fmtTs(r.ts))}</div>
    </div>
    <div class="card__rows">
      ${fields.map((k) => `<div class="card__row"><b>${escapeHtml(FIELD_LABELS[k] || k)}</b><span>${escapeHtml(r.data[k] || "")}</span></div>`).join("")}
    </div>
    <div class="card__actions">
      ${canPay ? `<button data-act="paid">${r.paid ? "Unmark paid" : "Confirm paid"}</button>` : ""}
      <button data-act="read">${r.read ? "Mark unread" : "Mark read"}</button>
      <button data-act="delete">Delete</button>
    </div>
  `;
  if (canPay){
    card.querySelector('[data-act="paid"]').addEventListener("click", async () => {
      await window.BoatoSubmissions.adminUpdate(getAdminSecret(), r.id, { paid: !r.paid });
      r.paid = !r.paid;
      render();
    });
  }
  card.querySelector('[data-act="read"]').addEventListener("click", async () => {
    await window.BoatoSubmissions.adminUpdate(getAdminSecret(), r.id, { read: !r.read });
    r.read = !r.read;
    render();
  });
  card.querySelector('[data-act="delete"]').addEventListener("click", async () => {
    if (!confirm("Delete this submission?")) return;
    await window.BoatoSubmissions.adminRemove(getAdminSecret(), r.id);
    ALL = ALL.filter((x) => x.id !== r.id);
    render();
  });
  return card;
}

function exportCsv(type){
  const rows = ALL.filter((r) => r.type === type);
  if (!rows.length) return;
  const keys = Array.from(rows.reduce((set, r) => { Object.keys(r.data).forEach((k) => set.add(k)); return set; }, new Set()));
  const header = ["Submitted", ...keys];
  const lines = [header.join(",")];
  rows.forEach((r) => {
    const line = [fmtTs(r.ts), ...keys.map((k) => `"${String(r.data[k] || "").replace(/"/g, '""')}"`)];
    lines.push(line.join(","));
  });
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "boato-" + type + "-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
}

async function loadAndRender(){
  ALL = await window.BoatoSubmissions.adminFetchAll(getAdminSecret());
  render();
}

document.getElementById("search").addEventListener("input", render);

/* ---------- Add submission manually ---------- */
function openAddModal(){
  ["addName","addEmail","addPhone","addSeats","addTime","addDinner","addDate","addNote"].forEach((id) => document.getElementById(id).value = "");
  document.getElementById("addType").value = "supper";
  document.getElementById("addOverlay").classList.add("on");
}
function closeAddModal(){
  document.getElementById("addOverlay").classList.remove("on");
}
document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("addCancel").addEventListener("click", closeAddModal);
document.getElementById("addOverlay").addEventListener("click", (e) => { if (e.target.id === "addOverlay") closeAddModal(); });

document.getElementById("addSave").addEventListener("click", async () => {
  const type = document.getElementById("addType").value;
  const data = {
    Name: document.getElementById("addName").value.trim(),
    Email: document.getElementById("addEmail").value.trim(),
    Phone: document.getElementById("addPhone").value.trim(),
    Seats: document.getElementById("addSeats").value.trim(),
    Time: document.getElementById("addTime").value.trim(),
    Dinner: document.getElementById("addDinner").value.trim(),
    Date: document.getElementById("addDate").value.trim(),
    Note: document.getElementById("addNote").value.trim()
  };
  Object.keys(data).forEach((k) => { if (!data[k]) delete data[k]; });
  if (!data.Name && !data.Email){
    alert("Add at least a name or email.");
    return;
  }
  await window.BoatoSubmissions.save(type, data);
  closeAddModal();
  await loadAndRender();
});

/* ---------- Auth ----------
   The typed password itself (not a hash) is what's stored in
   sessionStorage and sent to Supabase — the RPC functions in
   supabase-rls-setup.sql compare against the real password
   server-side. Only the *verification* here is hash-based, so this
   file never contains the real password in the clear. */
function getAdminSecret(){
  return sessionStorage.getItem(SESSION_KEY) || "";
}
function showDash(){
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("dash").classList.add("on");
  loadAndRender();
}
async function tryLogin(){
  const val = document.getElementById("pw").value;
  const hash = await window.BoatoSubmissions.sha256Hex(val);
  if (hash === ADMIN_PASSWORD_HASH){
    sessionStorage.setItem(SESSION_KEY, val);
    showDash();
  } else {
    document.getElementById("pwErr").textContent = "Incorrect password.";
  }
}
document.getElementById("pwSubmit").addEventListener("click", tryLogin);
document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById("dash").classList.remove("on");
  document.getElementById("loginWrap").style.display = "flex";
  document.getElementById("pw").value = "";
});

if (sessionStorage.getItem(SESSION_KEY)) showDash();
</script>
</body>
</html>
