    <h1>Boato Supper Club — Private Dining in Lisbon</h1>
    <p><strong>Follow the rumor.</strong> Boato is a private supper club created by Chef Miguel Ângelo in Lisbon. Twelve seats, one long table, and a secret location we whisper to you 24 hours before.</p>
    <h2>The concept</h2>
    <p>Boato is not a restaurant — it's a rumor you're now part of. A shared seasonal tasting menu, somewhere in Lisbon you wouldn't expect. Seasonal, local, and slightly improvised, the way the best dinners are.</p>
    <h2>The dinners</h2>
    <p>Past tables, and the next one. Secret-location supper clubs, surprise pop-ups, corporate dinners and fully private events. Seats are limited; addresses are shared 24 hours before each dinner.</p>
    <h2>Private &amp; corporate</h2>
    <p>Host your own rumor: take over a full Boato table, or commission a dinner for your team or clients. Bespoke menus, full production, wine and cocktail pairings, hosted in Portuguese, English, Spanish and Italian.</p>
    <h2>The chef</h2>
    <p>Miguel Ângelo — Lisbon-born and restaurant-trained — shops the market the morning of each dinner and lets it decide the menu: Portuguese ingredients, contemporary technique, a story behind every plate.</p>
    <h2>Reservations</h2>
    <p>Reserve a seat or request an invitation: <a href="mailto:info.boatosupper@gmail.com">info.boatosupper@gmail.com</a> · <a href="https://www.instagram.com/boato.supperclub/" rel="noopener">@boato.supperclub</a> · Lisbon, Portugal.</p>
  </main>
</noscript>

<script type="text/babel" src="site/i18n.jsx"></script>
<script type="text/babel" src="site/components.jsx"></script>
<script type="text/babel" src="site/sections.jsx"></script>
<script type="text/babel" src="site/tweaks-panel.jsx"></script>
<script type="text/babel" src="site/landing.jsx"></script>
<script type="text/babel">
const SCRIPT_FONTS = {
  "Italianno":     '"Italianno", cursive',
  "Pinyon Script": '"Pinyon Script", cursive',
  "Parisienne":    '"Parisienne", cursive',
};
const CTA_KEYS = ["reserve", "apply", "request", "follow"];
const LANGS = [["English", "en"], ["Português", "pt"]];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "pt",
  "headline": "script",
  "scriptFont": "Italianno",
  "scriptColor": "#F4EFE6",
  "ctaKey": "reserve",
  "navStyle": "solid",
  "scrim": 0.46
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [reserve, setReserve] = React.useState(() => {
    try { if (new URLSearchParams(window.location.search).get("paid") === "1") return { card: null, paid: true }; } catch (e) {}
    return null;
  });
  const open = (card) => setReserve({ card: card && card.title ? card : null });

  // Strip the ?paid=1 marker after Stripe redirects back, so a refresh
  // doesn't re-open the confirmation.
  React.useEffect(() => {
    if (reserve && reserve.paid) {
      try { window.history.replaceState({}, "", window.location.pathname + window.location.hash); } catch (e) {}
    }
  }, []);

  // The primary CTA ("Reserve a seat" / "Reservar lugar") scrolls to the
  // dinners section instead of opening the reservation modal.
  const goToDinners = () => {
    const el = document.querySelector("#dinners");
    if (!el) return;
    el.classList.add("in");
    el.querySelectorAll(".reveal").forEach(r => r.classList.add("in"));
    const nav = document.querySelector(".lp-nav");
    const navH = nav ? nav.getBoundingClientRect().height : 0;
    const rect = el.getBoundingClientRect();
    const elTop = rect.top + window.scrollY;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const target = Math.max(0, Math.min(elTop - navH + 90, max));
    window.scrollTo({ top: target, behavior: "smooth" });
  };

  const lang = t.lang === "pt" ? "pt" : "en";
  const L = STRINGS[lang];
  const ctaLabel = L.cta[t.ctaKey] || L.cta.reserve;
  const setLang = (v) => setTweak("lang", v);

  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);

  // Scroll-reveal for kit sections
  React.useEffect(() => {
    const root = document.documentElement;
    root.classList.add("js-anim");
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    const els = document.querySelectorAll(".reveal");
    els.forEach(el => io.observe(el));
    const timer = setTimeout(() => els.forEach(el => el.classList.add("in")), 3000);
    return () => { io.disconnect(); clearTimeout(timer); };
  }, []);

  React.useEffect(() => { document.body.style.overflow = reserve ? "hidden" : ""; }, [reserve]);

  // Center in-page anchor targets in the viewport (instead of landing at the top edge)
  React.useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const hash = a.getAttribute("href");
      if (!hash || hash === "#") return;
      const el = document.querySelector(hash);
      if (!el) return;
      e.preventDefault();
      if (hash === "#top") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      // Clear the target's scroll-reveal transform first, so measurement isn't skewed.
      el.classList.add("in");
      el.querySelectorAll(".reveal").forEach(r => r.classList.add("in"));
      const nav = document.querySelector(".lp-nav");
      const navH = nav ? nav.getBoundingClientRect().height : 0;
      const rect = el.getBoundingClientRect();
      const elTop = rect.top + window.scrollY;
      const elH = rect.height;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const fromFooter = !!a.closest(".footer") || a.classList.contains("lp-hero__textlink") || hash === "#concept" || hash === "#inquiry" || hash === "#chef";
      let target;
      if (fromFooter && hash !== "#dinners") {
        // Footer "Explorar": center the section in the area below the sticky nav.
        const avail = window.innerHeight - navH;
        target = elTop - navH - Math.max(0, (avail - elH) / 2);
        // "O Seu Boato" sits a touch lower than dead-center.
        if (hash === "#inquiry") target += 30;
        // "Chef" also sits a touch lower than dead-center.
        if (hash === "#chef") target += 34;
      } else {
        // Nav links: align the section's top just below the sticky nav.
        target = elTop - navH;
        // "Jantares" lands a touch lower into the section.
        if (hash === "#dinners") target += 90;
      }
      target = Math.max(0, Math.min(target, max));
      window.scrollTo({ top: target, behavior: "smooth" });
    };
    document.addEventListener("click", onClick);
    return () => document.removeEventListener("click", onClick);
  }, []);

  const styleVars = {
    "--lp-script": SCRIPT_FONTS[t.scriptFont] || SCRIPT_FONTS.Italianno,
    "--lp-script-color": t.scriptColor,
    "--lp-scrim": t.scrim,
  };

  return (
    <div style={styleVars}>
      <LpNav onReserve={goToDinners} tweaks={t} L={L} lang={lang} onLang={setLang} ctaLabel={ctaLabel} />
      <LpHero onReserve={goToDinners} tweaks={t} L={L} ctaLabel={ctaLabel} />
      <Dinners L={L} onReserve={open} />
      <Inquiry L={L} onReserve={open} />
      <Concept L={L} />
      <Chef L={L} />
      <Footer L={L} />
      {reserve && <ReserveModal L={L} card={reserve.card} paid={reserve.paid} onClose={() => setReserve(null)} />}

      <TweaksPanel>
        <TweakSection label="Language" />
        <TweakRadio label="Site language" value={lang}
          options={LANGS.map(([lbl]) => lbl)}
          onChange={(lbl) => setLang((LANGS.find(([l]) => l === lbl) || [])[1] || "en")} />

        <TweakSection label="Headline" />
        <TweakRadio label="Style" value={t.headline}
          options={["script", "serif"]}
          onChange={(v) => setTweak("headline", v)} />
        <TweakSelect label="Script face" value={t.scriptFont}
          options={["Italianno", "Pinyon Script", "Parisienne"]}
          onChange={(v) => setTweak("scriptFont", v)} />
        <TweakColor label="Script ink" value={t.scriptColor}
          options={["#F4EFE6", "#DA0001", "#A65C3B", "#CFC4AC"]}
          onChange={(v) => setTweak("scriptColor", v)} />

        <TweakSection label="Hero" />
        <TweakSlider label="Photo darkness" value={t.scrim} min={0} max={1} step={0.02}
          onChange={(v) => setTweak("scrim", v)} />
        <TweakRadio label="Nav" value={t.navStyle}
          options={["solid", "transparent"]}
          onChange={(v) => setTweak("navStyle", v)} />

        <TweakSection label="Call to action" />
        <TweakSelect label="Button label" value={L.cta[t.ctaKey]}
          options={CTA_KEYS.map((k) => L.cta[k])}
          onChange={(label) => setTweak("ctaKey", CTA_KEYS[CTA_KEYS.map((k) => L.cta[k]).indexOf(label)] || "reserve")} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
